[package]
name = "review"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Fast terminal code review for local Git changes"

[dependencies]
arborium = { version = "2.18.1", default-features = false, features = ["lang-css", "lang-dockerfile", "lang-html", "lang-ini", "lang-java", "lang-javascript", "lang-json", "lang-make", "lang-markdown", "lang-nix", "lang-python", "lang-rust", "lang-sql", "lang-toml", "lang-tsx", "lang-typescript", "lang-xml", "lang-yaml"] }
arborium-theme = { version = "2.18.1", default-features = false }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
similar = "3.1.1"
unicode-width = { version = "0.2.2", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Generated tree-sitter parsers are large C sources. Debug symbols add no value
# to normal checks and can exhaust constrained Nix build sandboxes.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
assigning_clones = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unused_self = "allow"
